# ============================================================
# BM7 - Mihomo / Nikki Edition
# ============================================================
# 适用于：
#   Xiaomi AX3000T
#   OpenWrt 25.12.x
#   Nikki
#   Mihomo Alpha
#
# 架构：
#   机场订阅
#       ↓
#   proxy-provider
#       ↓
#   地区自动筛选
#       ↓
#   BM7 策略组
#       ↓
#   BM7 Rule Provider
#       ↓
#   Nikki TUN / Firewall4
#
# 注意：
#   TUN / DNS 劫持 / 路由由 Nikki 负责
# ============================================================


# ============================================================
# 基础
# ============================================================

mixed-port: 7890

allow-lan: true

mode: rule

log-level: warning

ipv6: true


# ============================================================
# 外部控制
# ============================================================

external-controller: 0.0.0.0:9090

secret: "181861"


# ============================================================
# Authentication
# ============================================================

authentication:
  - "nikki:181861"


# ============================================================
# Profile
# ============================================================

profile:
  store-selected: true
  store-fake-ip: true


# ============================================================
# Tun
# ============================================================
# 不启用。
#
# Nikki 已经负责：
#   - TUN
#   - firewall4
#   - DNS hijack
#   - LAN transparent proxy
#
# 千万不要在这里再开启一套 TUN。
# ============================================================

tun:
  enable: false


# ============================================================
# DNS
# ============================================================
# DNS 由 Nikki 接管。
# ============================================================

dns:
  enable: false


# ============================================================
# Sniffer
# ============================================================

sniffer:
  enable: true

  parse-pure-ip: true

  override-destination: true

  sniff:
    HTTP:
      ports:
        - 80
        - 8080-8880

    TLS:
      ports:
        - 443
        - 8443

    QUIC:
      ports:
        - 443
        - 8443

  skip-domain:
    - "+.lan"
    - "+.local"
    - "Mijia Cloud"
    - "+.push.apple.com"


# ============================================================
# GEOIP / GEOSITE
# ============================================================

geodata-mode: true

geodata-loader: memconservative


# ============================================================
# Proxy Provider
# ============================================================
#
# 这里填写你的机场「Clash/Mihomo 节点订阅」URL。
#
# 非常重要：
# URL 必须返回 proxy-provider 可以解析的节点列表。
#
# 如果机场 URL 返回的是：
#
#   dns:
#   port:
#   socks-port:
#   proxies:
#   proxy-groups:
#   rules:
#
# 这种完整 Clash 配置，
# 就不能直接作为 proxy-provider。
#
# 应使用机场后台提供的：
#
#   Clash
#   Clash Meta
#   Mihomo
#   Clash Node
#   节点订阅
#
# 之类的节点输出。
#
# ============================================================

proxy-providers:

  Airport:
    type: http

    url: "https://yuxic9894.ccwu.cc/sub?token=76d79614792f0896194176ce95357716"

    path: ./proxy_providers/airport.yaml

    interval: 86400

    health-check:
      enable: true

      url: https://www.gstatic.com/generate_204

      interval: 300

      timeout: 5000

      lazy: true

      expected-status: 204


# ============================================================
# Direct
# ============================================================

proxies:

  - name: DIRECT
    type: direct
    udp: true


# ============================================================
# Proxy Groups
# ============================================================


# ------------------------------------------------------------
# 总入口
# ------------------------------------------------------------

  # ----------------------------------------------------------
  # Available
  # ----------------------------------------------------------

# ============================================================
# 核心策略组
# ============================================================

proxy-groups:

  # ----------------------------------------------------------
  # Available
  # ----------------------------------------------------------

  - name: Available
    type: select

    proxies:
      - Auto
      - HK
      - SG
      - JP
      - TW
      - KR
      - US
      - Others
      - DIRECT

    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/mini/Proxy.png


  # ----------------------------------------------------------
  # Auto
  # ----------------------------------------------------------

  - name: Auto
    type: url-test

    use:
      - Airport

    filter: "^(?!.*(?:直连|DIRECT)).*$"

    url: https://www.gstatic.com/generate_204

    interval: 300

    timeout: 5000

    tolerance: 50

    lazy: true

    max-failed-times: 3

    expected-status: 204

    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/mini/Auto.png


