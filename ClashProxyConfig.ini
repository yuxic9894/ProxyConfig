[custom]

;=========================
; 基础设置
;=========================
enable_rule_generator=true
overwrite_original_rules=true

; ===== 分流 =====
ruleset=🛑 Advertising,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/Advertising/Advertising.list
ruleset=🎯 Direct,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/ChinaMax/ChinaMax.list
ruleset=✨ AI Tools,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/OpenAI/OpenAI.list
ruleset=✨ AI Tools,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Claude/Claude.list
ruleset=✨ AI Tools,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Gemini/Gemini.list
ruleset=📺 TikTok,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/TikTok/TikTok.list
ruleset=🍎 Apple,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/AppleTV/AppleTV.list
ruleset=🍎 Apple,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/Apple/Apple.list
ruleset=🎮 Games,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/Game/Game.list
ruleset=🐟 Final,[]FINAL

;=========================
; 核心策略组 (Proxy Groups)
;=========================
custom_proxy_group=🚀 Available`select`[]♻️ Auto`[]🇭🇰 HK`[]🇸🇬 SG`[]🇯🇵 JP`[]🇹🇼 TW`[]🇰🇷 KR`[]🇺🇲 US
custom_proxy_group=✨ AI Tools`select`[]🇺🇲 US`[]🇸🇬 SG`[]🇯🇵 JP
custom_proxy_group=📺 TikTok`select`[]🚀 Available`[]🇯🇵 JP`[]🇭🇰 HK`[]🇸🇬 SG`[]🇹🇼 TW`[]🇰🇷 KR`[]🇺🇲 US
custom_proxy_group=🍎 Apple`select`[]DIRECT`[]🚀 Available
custom_proxy_group=🎮 Games`select`[]DIRECT`[]🚀 Available
custom_proxy_group=🇭🇰 HK`url-test`(?i)(香港|H\p{Cf}*K|Hong Kong)`http://www.gstatic.com/generate_204`300,5,50
custom_proxy_group=🇸🇬 SG`url-test`(?i)(新加坡|S\p{Cf}*G|Singapore)`http://www.gstatic.com/generate_204`300,5,50
custom_proxy_group=🇯🇵 JP`url-test`(?i)(日本|J\p{Cf}*P|Japan)`http://www.gstatic.com/generate_204`300,5,50
custom_proxy_group=🇹🇼 TW`url-test`(?i)(台湾|T\p{Cf}*W|Taiwan)`http://www.gstatic.com/generate_204`300,5,50
custom_proxy_group=🇰🇷 KR`url-test`(?i)(韩国|K\p{Cf}*R|Korea)`http://www.gstatic.com/generate_204`300,5,50
custom_proxy_group=🇺🇲 US`url-test`(?i)(美国|U\p{Cf}*S|United States)`http://www.gstatic.com/generate_204`300,5,50
custom_proxy_group=♻️ Auto`url-test`[]🇭🇰 HK`[]🇯🇵 JP`[]🇸🇬 SG`[]🇹🇼 TW`[]🇰🇷 KR`[]🇺🇲 US`http://www.gstatic.com/generate_204`300,5,50
custom_proxy_group=🛑 Advertising`select`[]REJECT`[]DIRECT
custom_proxy_group=🎯 Direct`select`[]DIRECT`[]🚀 Available