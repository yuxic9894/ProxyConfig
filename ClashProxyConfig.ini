ruleset=🐟 Final,[]FINAL

;=========================
; 核心策略组 (Proxy Groups)
;=========================
custom_proxy_group=🚀 节点选择`select`[]♻️ Auto`[]🇭🇰 HK`[]🇯🇵 JP`[]🇸🇬 SG`[]🇨🇳 TW`[]🇰🇷 KR`[]🇺🇲 US`[]🇺🇳 Others`[]DIRECT
custom_proxy_group=✨ AI Tools`select`[]🇺🇲 US`[]🇸🇬 SG`[]🇯🇵 JP
custom_proxy_group=📲 Telegram`select`[]🚀 节点选择`[]♻️ Auto`[]🇭🇰 HK
custom_proxy_group=📹 Youtube`select`[]🚀 节点选择`[]♻️ Auto`[]🇭🇰 HK`[]🇸🇬 SG`[]🇺🇲 US
custom_proxy_group=🛒 跨境电商`select`[]🇸🇬 SG`[]🇰🇷 KR`[]🇺🇲 US`[]🇭🇰 HK`[]🇯🇵 JP`[]DIRECT
custom_proxy_group=🍎 Apple`select`[]DIRECT`[]🚀 节点选择
custom_proxy_group=🎮 Games`select`[]DIRECT`[]🚀 节点选择
custom_proxy_group=🦊 NSFW`select`[]🇺🇲 US`[]🇭🇰 HK`[]🇯🇵 JP`[]🇸🇬 SG`[]🇨🇳 TW`[]🇰🇷 KR`[]🚀 节点选择
custom_proxy_group=🇭🇰 HK`url-test`(?i)(港|HK|H\p{Cf}*K|Hong Kong)`http://www.gstatic.com/generate_204`300,5,50
custom_proxy_group=🇸🇬 SG`url-test`(?i)(新|SG|S\p{Cf}*G|Singapore)`http://www.gstatic.com/generate_204`300,5,50
custom_proxy_group=🇯🇵 JP`url-test`(?i)(日|JP|J\p{Cf}*P|Japan)`http://www.gstatic.com/generate_204`300,5,50
custom_proxy_group=🇨🇳 TW`url-test`(?i)(台|TW|T\p{Cf}*W|Taiwan)`http://www.gstatic.com/generate_204`300,5,50
custom_proxy_group=🇰🇷 KR`url-test`(?i)(韩|KR|K\p{Cf}*R|Korea)`http://www.gstatic.com/generate_204`300,5,50
custom_proxy_group=🇺🇲 US`url-test`(?i)(美|US|U\p{Cf}*S|United States)`http://www.gstatic.com/generate_204`300,5,50
custom_proxy_group=🇺🇳 Others`url-test`(?i)^(?!.*(港|HK|H\p{Cf}*K|Hong Kong|新|SG|S\p{Cf}*G|Singapore|日|JP|J\p{Cf}*P|Japan|台|TW|T\p{Cf}*W|Taiwan|韩|KR|K\p{Cf}*R|Korea|美|US|U\p{Cf}*S|United States)).*`http://www.gstatic.com/generate_204`300,5,50
custom_proxy_group=♻️ Auto`url-test`[]🇭🇰 HK`[]🇯🇵 JP`[]🇸🇬 SG`[]🇨🇳 TW`[]🇰🇷 KR`[]🇺🇲 US`[]🇺🇳 Others`http://www.gstatic.com/generate_204`300,5,50
custom_proxy_group=🎯 Direct`select`[]DIRECT`[]🚀 节点选择
custom_proxy_group=🛑 Advertising`select`[]REJECT`[]DIRECT
custom_proxy_group=🐟 Final`select`[]🚀 节点选择`[]DIRECT

stream_rule=^剩余流量：(.*?)\|总流量：(.*)$|total=$2&left=$1
stream_rule=^剩余流量：(.*?) (.*)$|total=$1&left=$2
stream_rule=^Bandwidth: (.*?)/(.*)$|used=$1&total=$2
stream_rule=^\[.*?\]剩余(.*?)@(?:.*)$|total=$1
stream_rule=^.*?流量:(.*?) 剩:(?:.*)$|total=$1
time_rule=^过期时间：(\d+)-(\d+)-(\d+) (\d+):(\d+):(\d+)$|$1:$2:$3:$4:$5:$6
time_rule=^到期时间(:|：)(\d+)-(\d+)-(\d+)$|$1:$2:$3:0:0:0
time_rule=^Smart Access expire: (\d+)/(\d+)/(\d+)$|$1:$2:$3:0:0:0
time_rule=^.*?流量:(?:.*?) 剩:(.*)$|left=$1d